name: Build & Deploy Kestura Hub

on:
  # Daily refresh at 04:30 UTC (catches newly launched sites within 24h)
  schedule:
    - cron: "30 4 * * *"
  # Rebuild whenever the hub source changes
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate hub from LGLenz repos
        env:
          # Cross-repo read of CNAME files needs a token with read access to the
          # LGLenz repos. The default GITHUB_TOKEN can read this repo; for private
          # sibling repos, set a HUB_TOKEN secret (fine-grained PAT, repo:read).
          GITHUB_TOKEN: ${{ secrets.HUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit regenerated files (if changed)
        run: |
          git config user.name "kestura-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data/links.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-refresh hub links [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
